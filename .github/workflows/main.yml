name: Build Xyverra APK

'on':
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build APK
    run: |
      if [ ! -f gradlew ]; then
        echo "ERROR: gradlew tidak ditemukan di folder utama."
        exit 1
      fi
      chmod +x gradlew
      ./gradlew --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Xyverra-v1.0-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error

name: Build Xyverra APK

'on':
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set Up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build APK
    run: |
      if [ -f ./gradlew ]; then
        chmod +x ./gradlew
        ./gradlew --no-daemon assembleDebug
      elif [ -f ./app/gradlew ]; then
        cd app
        chmod +x ./gradlew
        ./gradlew --no-daemon assembleDebug
      else
        echo "ERROR: Gradle wrapper tidak ditemukan."
        exit 1
      fi

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Xyverra-v1.0-debug-apk
      path: |
        **/build/outputs/apk/debug/*.apk
      if-no-files-found: error
